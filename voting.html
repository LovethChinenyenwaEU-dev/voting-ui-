<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System - Africaplan Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <header class="bg-pink-600 text-white py-4 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide">Africaplan Foundation</h1>
        <p class="text-sm opacity-90">Official Voting Portal</p>
    </header>

    
    <div class="flex flex-col justify-center items-center flex-grow p-5 space-y-6">

        <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl p-8">
            <h1 class="text-4xl font-bold text-center text-pink-600">Voting System</h1>
            <p class="text-center text-gray-500 mt-1">Cast your vote here</p>

            <form id="voteForm" class="space-y-5 mt-6">
            
                <div>
                    <label for="voterName" class="font-semibold text-gray-700 block mb-1">Voter's Name</label>
                    <input type="text" id="voterName" required autocomplete="name" placeholder="Enter your name" class="w-full border rounded-xl p-3 focus:outline-pink-500">
                </div>

                
                <div>
                    <label for="candidateSelect" class="font-semibold text-gray-700 block mb-1">Choose Candidate</label>
                    <select id="candidateSelect" required class="w-full border rounded-xl p-3 bg-white focus:outline-pink-500" title="Select a candidate">
                        <option value="" disabled selected>Select a candidate</option>
                        <option value="Stephaine">Stephaine</option>
                        <option value="Victor">Victor</option>
                    </select>
                </div>

            
                <button type="submit" id="voteBtn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200">
                    Vote
                </button>
            </form>
        </div>

        
        <div class="max-w-lg w-full flex flex-col sm:flex-row gap-4">
            
            <div class="bg-white flex-1 p-5 rounded-2xl shadow-md border-t-4 border-pink-500">
                <h3 class="font-bold text-pink-600 mb-2 text-lg">Votes Per Candidate</h3>
                <div id="candidateTallies" class="space-y-1 text-gray-700 font-medium">
                    <p>Stephaine: <span id="count-Stephaine" class="font-bold">0</span></p>
                    <p>Victor: <span id="count-Victor" class="font-bold">0</span></p>
                </div>
            </div>

            
            <div class="bg-pink-600 text-white p-5 rounded-2xl shadow-md flex flex-col justify-between items-center w-full sm:w-40 text-center">
                <h3 class="font-bold text-sm tracking-wider uppercase opacity-90">Total Votes</h3>
                <span id="totalVotesCount" class="text-5xl font-black block mt-2">0</span>
            </div>
        </div>

        <div class="max-w-lg w-full text-center">
            <button id="viewWinnerBtn" type="button" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md w-full">
                Check Result
            </button>
        </div>

    </div>

    <div id="winnerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto text-3xl mb-4">🏆</div>
            <h2 class="text-2xl font-black text-gray-800">Election Over!</h2>
            <p id="winnerMessage" class="text-gray-600 my-4 text-lg font-medium"></p>
            <button id="closeModalBtn" type="button" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-xl transition w-full">
                Close Results
            </button>
        </div>
    </div>


    <script type="module" src="./dist/voting.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
 
<div class="flex justify-center items-center min-h-screen p-5">

<div class="bg-grey max-w-lg w-full rounded-3xl shadow-2xl p-8">

<h1 class="text-4xl font-bold text-center text-pink-600">
Voting System
</h1>

<p class="text-center text-white-500">
Cast your vote here
</p>

<form id="voteForm" class="space-y-5 mt-6">

<div>

<label class="font-semibold">Voter's Name</label>

<input
type="text"
id="voterName"
required
placeholder="Enter your name"
class="w-full border rounded-xl p-3">

</div>

<div>

<label class="font-semibold">Choose Candidate</label>

<select
id="candidate"
required
class="w-full border rounded-xl p-3">

<option value="">Select Candidate</option>
<option value="stephaine">stephaine</option>
<option value="victor">victor</option>
<option value="amara">amara</option>
<option value="rita">rita</option>

</select>

</div>

<button
type="submit"
class="w-full bg-pink-600 text-black p-3 rounded-xl hover:bg-pink-700">

Vote

</button>

</form>

<div class="mt-8">

<h2 class="font-bold text-xl text-pink-600">

Leaderboard

</h2>

<div id="leaderboard"></div>

</div>

</div>

</div>

<div class="fixed bottom-6 left-6 bg-white shadow-xl rounded-xl p-5 w-56">

<h2 class="font-bold text-pink-600">
Votes Per Candidate
</h2>

<p>stephaine : <span id="stephVotes">0</span></p>
<p>victor : <span id="victorVotes">0</span></p>
<p>amara : <span id="amaraVotes">0</span></p>
<p>rita : <span id="ritaVotes">0</span></p>

</div>

<div class="fixed bottom-6 right-6 bg-pink-600 text-black rounded-xl shadow-xl p-5 w-52">

<h2 class="font-bold">

Total Votes

</h2>

<p
id="totalVotes"
class="text-5xl text-center">

0

</p>

</div>

<!-- Winner -->

<div
id="winnerModal"
class="hidden fixed inset-0 bg-black/60 flex justify-center items-center">

<div class="bg-white p-8 rounded-3xl text-center">

<h2 class="text-3xl text-green-600 font-bold">

Winner

</h2>

<p
id="winnerName"
class="text-2xl mt-5">

</p>

<button
id="closeModal"
class="bg-red-500 text-black px-6 py-3 rounded-xl mt-6">

Close

</button>

</div>

</div>

<script>
    
</script>

</body>
</html>
